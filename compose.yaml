services:
  fastzero_database:
    image: postgres:17
    volumes:
      - app_database_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastzero_app:
    image: fastzero_app
    entrypoint: ["./entrypoint.sh"]
    build: .
    ports:
      - "8000:8000"
    depends_on:
      fastzero_database:
         condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@fastzero_database:5432/app_db

volumes:
  app_database_data: